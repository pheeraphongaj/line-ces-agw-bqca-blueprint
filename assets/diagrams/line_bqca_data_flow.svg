<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="851" viewBox="0 0 1840 851" font-family="'Noto Sans CJK JP','Noto Sans JP','Roboto','Arial',sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/></marker></defs>
<rect width="1840" height="851" fill="#FFFFFF"/>
<text x="48" y="74" font-size="26" font-weight="700" fill="#202124">End-to-End Dataflow: LINE OA → Hybrid Auth &amp; Firestore → CES → GEAP AGW (Stateless STS) → BQCA &amp; BigQuery RLS</text>
<text x="48" y="100" font-size="14" fill="#5F6368">Phase A: Hybrid Onboarding (Partner CIP vs Internal IAP)  |  Phase B: Zero-Token LLM, Stateless RAM STS &amp; Store-Level Native RLS</text>
<rect x="87.4" y="124.0" width="312.5" height="283.0" rx="16" fill="none" stroke="#F9AB00" stroke-width="2" stroke-dasharray="7 5"/>
<text x="105.4" y="151.0" font-size="14" font-weight="700" fill="#F9AB00">PHASE A1. LINE 1-CARD LOGIN GATE</text>
<rect x="105.4" y="166.0" width="276.5" height="65.0" rx="11" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2.5"/>
<text x="243.7" y="193.0" font-size="14" font-weight="700" fill="#B06000" text-anchor="middle">Default 1-Card Rich Menu</text>
<text x="243.7" y="213.0" font-size="11.5" fill="#B06000" fill-opacity="0.85" text-anchor="middle">Shown to all unauthenticated LINE users</text>
<rect x="105.4" y="245.0" width="276.5" height="65.0" rx="11" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2"/>
<text x="243.7" y="272.0" font-size="14" font-weight="700" fill="#B06000" text-anchor="middle">Tap Login Button (&#x27;เข้าสู่ระบบ&#x27;)</text>
<text x="243.7" y="292.0" font-size="11.5" fill="#B06000" fill-opacity="0.85" text-anchor="middle">Sends message event to POST /line/webhook</text>
<rect x="105.4" y="324.0" width="276.5" height="65.0" rx="11" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2.5"/>
<text x="243.7" y="351.0" font-size="14" font-weight="700" fill="#B06000" text-anchor="middle">HMAC-SHA256 Signed State</text>
<text x="243.7" y="371.0" font-size="11.5" fill="#B06000" fill-opacity="0.85" text-anchor="middle">Captures source.userId · Signs uid:exp</text>
<rect x="509.9" y="124.0" width="347.4" height="283.0" rx="16" fill="none" stroke="#1A73E8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="527.9" y="151.0" font-size="14" font-weight="700" fill="#1A73E8">PHASE A2. DUAL IDENTITY GATE</text>
<rect x="527.9" y="166.0" width="311.4" height="65.0" rx="11" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
<text x="683.7" y="193.0" font-size="14" font-weight="700" fill="#1A73E8" text-anchor="middle">External B2B Partner Portal</text>
<text x="683.7" y="213.0" font-size="11.5" fill="#1A73E8" fill-opacity="0.85" text-anchor="middle">/auth/portal (Partner CIP · No GCP IAM needed)</text>
<rect x="527.9" y="245.0" width="311.4" height="65.0" rx="11" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
<text x="683.7" y="272.0" font-size="14" font-weight="700" fill="#1A73E8" text-anchor="middle">Internal Employee SSO Gate</text>
<text x="683.7" y="292.0" font-size="11.5" fill="#1A73E8" fill-opacity="0.85" text-anchor="middle">/auth/login behind Cloud IAP (ES256 JWT)</text>
<rect x="527.9" y="324.0" width="311.4" height="65.0" rx="11" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
<text x="683.7" y="351.0" font-size="14" font-weight="700" fill="#1A73E8" text-anchor="middle">External Browser Enforcement</text>
<text x="683.7" y="371.0" font-size="11.5" fill="#1A73E8" fill-opacity="0.85" text-anchor="middle">?openExternalBrowser=1 (Bypasses WebView 403)</text>
<rect x="967.4" y="124.0" width="337.7" height="283.0" rx="16" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-dasharray="7 5"/>
<text x="985.4" y="151.0" font-size="14" font-weight="700" fill="#1E8E3E">PHASE A3. FIRESTORE REGISTRY</text>
<rect x="985.4" y="166.0" width="301.7" height="65.0" rx="11" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="2.5"/>
<text x="1136.2" y="193.0" font-size="14" font-weight="700" fill="#137333" text-anchor="middle">line_partner_accounts</text>
<text x="1136.2" y="213.0" font-size="11.5" fill="#137333" fill-opacity="0.85" text-anchor="middle">Partner Tier · Allowed Store/County · Target SA</text>
<rect x="985.4" y="245.0" width="301.7" height="65.0" rx="11" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="2.5"/>
<text x="1136.2" y="272.0" font-size="14" font-weight="700" fill="#137333" text-anchor="middle">line_partner_registry/{uid}</text>
<text x="1136.2" y="292.0" font-size="11.5" fill="#137333" fill-opacity="0.85" text-anchor="middle">Binds line_user_id ↔ partner_id &amp; status=ACTIVE</text>
<rect x="985.4" y="324.0" width="301.7" height="65.0" rx="11" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="2"/>
<text x="1136.2" y="351.0" font-size="14" font-weight="700" fill="#137333" text-anchor="middle">Zero Stored OAuth Tokens!</text>
<text x="1136.2" y="371.0" font-size="11.5" fill="#137333" fill-opacity="0.85" text-anchor="middle">No raw/encrypted ya29... tokens on gs:// bucket</text>
<rect x="1415.1" y="124.0" width="337.8" height="283.0" rx="16" fill="none" stroke="#9334E6" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1433.1" y="151.0" font-size="14" font-weight="700" fill="#9334E6">PHASE A4. 6-CARD MENU UNLOCK</text>
<rect x="1433.1" y="166.0" width="301.8" height="65.0" rx="11" fill="#F3E8FD" stroke="#9334E6" stroke-width="2.5"/>
<text x="1584.0" y="193.0" font-size="14" font-weight="700" fill="#8430CE" text-anchor="middle">Per-User Rich Menu Link API</text>
<text x="1584.0" y="213.0" font-size="11.5" fill="#8430CE" fill-opacity="0.85" text-anchor="middle">POST /v2/bot/user/{uid}/richmenu/{6card_id}</text>
<rect x="1433.1" y="245.0" width="301.8" height="65.0" rx="11" fill="#F3E8FD" stroke="#9334E6" stroke-width="2.5"/>
<text x="1584.0" y="272.0" font-size="14" font-weight="700" fill="#8430CE" text-anchor="middle">6-Card Analytics Rich Menu</text>
<text x="1584.0" y="292.0" font-size="11.5" fill="#8430CE" fill-opacity="0.85" text-anchor="middle">Instantly swaps user&#x27;s LINE screen (1 → 6 Cards)</text>
<rect x="1433.1" y="324.0" width="301.8" height="65.0" rx="11" fill="#F3E8FD" stroke="#9334E6" stroke-width="2"/>
<text x="1584.0" y="351.0" font-size="14" font-weight="700" fill="#8430CE" text-anchor="middle">Partner Badge Flex Push</text>
<text x="1584.0" y="371.0" font-size="11.5" fill="#8430CE" fill-opacity="0.85" text-anchor="middle">Confirms active RLS scope (e.g. Store #2633)</text>
