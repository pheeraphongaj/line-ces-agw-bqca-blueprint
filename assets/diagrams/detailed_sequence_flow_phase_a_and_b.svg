<text x="1165.0" y="205" text-anchor="middle" font-size="13.5" font-weight="700" fill="#137333">PHASE A: PRODUCTION OAUTH 2.0 / OIDC ONBOARDING (GCIP CUSTOM OIDC oidc.line, AUTH0 OR CLOUD IAP) &amp; PER-USER 6-CARD RICH MENU UNLOCK</text>
<rect x="44" y="234" width="618" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="353.0" y="249" text-anchor="middle" class="step-label">[A1] ผู้ใช้กดปุ่ม &#x27;เข้าสู่ระบบ (Sign In)&#x27; บน Default 1-Card Rich Menu (richmenu-&lt;1CARD_ID&gt;)</text>
<text x="353.0" y="265" text-anchor="middle" class="step-sub">LINE Platform ส่ง MESSAGE Webhook Event พร้อม source.userId (U...) และ replyToken</text>
<line x1="151" y1="276" x2="413" y2="276" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="184.5" y="318" width="741" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="555.0" y="333" text-anchor="middle" class="step-label">[A2] POST /line/webhook (ตรวจสอบ Header: X-Line-Signature HMAC-SHA256)</text>
<text x="555.0" y="349" text-anchor="middle" class="step-sub">สร้าง state = HMAC-SHA256(uid:exp) และตอบกลับด้วยปุ่ม Login Flex URI (?openExternalBrowser=1 กัน 403 WebView)</text>
<line x1="417" y1="360" x2="689" y2="360" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="201.5" y="402" width="727" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="565.0" y="417" text-anchor="middle" class="step-label">[A3] เปิด External Browser (Safari/Chrome) ยืนยันตัวตนผ่าน OIDC / SAML / Cloud IAP</text>
<text x="565.0" y="433" text-anchor="middle" class="step-sub">Partner ภายนอก: GCIP (ผูก Custom OIDC Provider https://access.line.me) หรือ Auth0 | พนักงานภายใน: Cloud IAP</text>
<line x1="151" y1="444" x2="975" y2="444" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<path d="M 979 520 L 1034 520 L 1034 554 L 983 554" fill="none" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="1042" y="517" width="715" height="39" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="1046" y="532" text-anchor="start" class="step-label">[A4] GCIP beforeSignIn Blocking Function (หรือ Auth0 Action) ทำงานอัตโนมัติ</text>
<text x="1046" y="549" text-anchor="start" class="step-sub">ดึงสิทธิ์จากตาราง rls_partner_entitlements และฝัง Custom Claims {partner_id, store_number} ลงใน OIDC JWT</text>
<rect x="499.5" y="586" width="673" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="836.0" y="601" text-anchor="middle" class="step-label">[A5] Redirect ส่ง OIDC ID Token / Code กลับมายัง GET /auth/callback (หรือ X-Goog-IAP-JWT-Assertion)</text>
<text x="836.0" y="617" text-anchor="middle" class="step-sub">Webhook Bridge ตรวจสอบลายเซ็น RS256/ES256 และตรวจสอบความถูกต้องของ state HMAC</text>
<line x1="979" y1="628" x2="697" y2="628" stroke="#3C4043" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-solid)"/>
<rect x="614.5" y="670" width="734" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="981.5" y="685" text-anchor="middle" class="step-label">[A6] บันทึกสถานะการผูกตัวตนใน Firestore line_partner_registry/{uid} (Zero Token Storage ใน Firestore/gs://!)</text>
<text x="981.5" y="701" text-anchor="middle" class="step-sub">เก็บเฉพาะ {oidc_sub, partner_id: &#x27;PARTNER-POLK-001&#x27;, store: &#x27;2633&#x27;, rls_policy_name, status: &#x27;ACTIVE&#x27;}</text>
<line x1="693" y1="712" x2="1266" y2="712" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="212.0" y="754" width="686" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="555.0" y="769" text-anchor="middle" class="step-label">[A7] POST https://api.line.me/v2/bot/user/{uid}/richmenu/{richmenu_6card_id}</text>
<text x="555.0" y="785" text-anchor="middle" class="step-sub">ปลดล็อกหน้าจอของผู้ใช้รายนั้นจากเมนู 1 การ์ด → เมนูวิเคราะห์ข้อมูล 6 การ์ด พร้อมส่ง Partner RLS Badge</text>
<line x1="693" y1="796" x2="421" y2="796" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="44" y="846" width="2242" height="32" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="1165.0" y="867" text-anchor="middle" font-size="13.5" font-weight="700" fill="#174EA6">PHASE B: RUNTIME ANALYTICS QUERY — ZERO X-TOKEN IN CES MCP, MODEL ARMOR, KMS/IAM STS TOKEN BROKER &amp; BIGQUERY NATIVE RLS</text>
<rect x="79.0" y="896" width="686" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="422.0" y="911" text-anchor="middle" class="step-label">[B1] Partner กดปุ่ม &#x27;Top 5 Stores&#x27; บนเมนู 6 การ์ด → LINE เรียก POST /line/webhook</text>
<text x="422.0" y="927" text-anchor="middle" class="step-sub">Bridge ตอบ HTTP 200 OK ใน &lt;50ms, เรียก POST /v2/bot/chat/loading/start และเริ่มจับเวลา 22.0s Watchdog</text>
<line x1="151" y1="938" x2="689" y2="938" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="638.5" y="980" width="686" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="981.5" y="995" text-anchor="middle" class="step-label">[B2] Pre-Check: อ่าน Firestore line_partner_registry/{uid} เพื่อตรวจสอบว่า status == ACTIVE</text>
<text x="981.5" y="1011" text-anchor="middle" class="step-sub">(หาก status == SUSPENDED → สลับ Rich Menu กลับเป็น 1 การ์ดและยุติการทำงานทันที โดยไม่สร้าง Token ใดๆ)</text>
<line x1="693" y1="1022" x2="1266" y2="1022" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="750.0" y="1064" width="754" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="1127.0" y="1079" text-anchor="middle" class="step-label">[B3] POST ces.googleapis.com/v1beta/.../sessions/line-{uid}-{partner}-rls24:runSession</text>
<text x="1127.0" y="1095" text-anchor="middle" class="step-sub">inputs: [{&#x27;variables&#x27;: {&#x27;line_user_id&#x27;: &#x27;U...&#x27;}}, {&#x27;text&#x27;: &#x27;Top 5 stores&#x27;}] — ไม่มี OAuth Token ใน LLM Context!</text>
<line x1="693" y1="1106" x2="1557" y2="1106" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="1311.5" y="1148" width="795" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="1709.0" y="1163" text-anchor="middle" class="step-label">[B4] CES McpToolset เรียก POST /mcp/ (service_account_auth_config roles/run.invoker | หรือ ADK ผ่าน Managed AGW)</text>
<text x="1709.0" y="1179" text-anchor="middle" class="step-sub">Tool Pinning ข้าม tools/list (-300ms) | customHeaders ส่งเฉพาะ {&#x27;x-line-user-id&#x27;: &#x27;U...&#x27;} — ไม่มีพารามิเตอร์ x-token!</text>
<line x1="1561" y1="1190" x2="1853" y2="1190" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<path d="M 1857 1266 L 1802 1266 L 1802 1300 L 1853 1300" fill="none" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="984" y="1263" width="810" height="39" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="1790" y="1278" text-anchor="end" class="step-label">[B5] FastMCP Zero-Trust PEP (หรือ ALB LbTrafficExtension /ext-proc/oauth-broker) บังคับใช้ 1P Model Armor</text>
<text x="1790" y="1295" text-anchor="end" class="step-sub">เรียก modelarmor.us-central1.rep.googleapis.com/v1/...:sanitizeUserPrompt สแกน Prompt Injection (PIJB) &amp; Sensitive PII</text>
<rect x="1169.5" y="1316" width="788" height="52" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="1563.5" y="1331" text-anchor="middle" class="step-label">[B6] ตรวจสอบ Firestore ACTIVE และแลก Short-Lived Token ใน RAM (แก้ปัญหา OIDC id_token หมดอายุใน 1 ชม.)</text>
<text x="1563.5" y="1347" text-anchor="middle" class="step-sub">• Mode A (1k–1M+): Cloud KMS asymmetricSign เซ็น JWT (5m) → แลก Workforce Pool Token ที่ sts.googleapis.com/v1/token</text>
<text x="1563.5" y="1363" text-anchor="middle" class="step-sub">• Mode B (&lt;50, Active): เรียก iamcredentials.googleapis.com/.../serviceAccounts/{partner_sa}:generateAccessToken</text>
<line x1="1857" y1="1374" x2="1274" y2="1374" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="1464" y="1434" width="822" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="1875.0" y="1449" text-anchor="middle" class="step-label">[B7] FastMCP ยิง POST geminidataanalytics.us.rep.googleapis.com/v1beta/.../locations/us:chat</text>
<text x="1875.0" y="1465" text-anchor="middle" class="step-sub">ส่ง HTTP Header: Authorization: Bearer &lt;sts_or_sa_token&gt; (ตามโค้ด ChatAction.kt:1695 ที่ใช้ HTTP Header สำหรับ BigQuery!)</text>
<line x1="1857" y1="1476" x2="2154" y2="1476" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<path d="M 2158 1552 L 2103 1552 L 2103 1586 L 2154 1586" fill="none" stroke="#3C4043" stroke-width="2" marker-end="url(#arrow-solid)"/>
<rect x="1326" y="1549" width="769" height="39" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="2091" y="1564" text-anchor="end" class="step-label">[B8] BigQuery รัน SQL ภายใต้ SESSION_USER() ของ Bearer Token (sa-partner-polk@... หรือ Workforce Pool Principal)</text>
<text x="2091" y="1581" text-anchor="end" class="step-sub">บังคับใช้ ROW ACCESS POLICY (rls_partner_polk_store_2633) กรองให้เห็นเฉพาะ Store #2633 ในระดับ Storage Engine!</text>
<rect x="1519.5" y="1618" width="680" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="1859.5" y="1633" text-anchor="middle" class="step-label">[B9] แปลง Vega-Lite vegaConfig → 2x Retina PNG (vl-convert) → อัปโหลดขึ้น gs://...-line-charts</text>
<text x="1859.5" y="1649" text-anchor="middle" class="step-sub">ส่งผลลัพธ์ JSON-RPC (answer, generated_sql, chart_url, followups, rls_badge) ย้อนกลับมายัง CES / ADK</text>
<line x1="2158" y1="1660" x2="1565" y2="1660" stroke="#3C4043" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-solid)"/>
<rect x="45.0" y="1702" width="754" height="36" rx="4" fill="#FFFFFF" opacity="0.94"/>
<text x="422.0" y="1717" text-anchor="middle" class="step-label">[B10] 22s Cutoff Guard จัดส่ง LINE Flex Bubble (กราฟ 2x PNG + ป้ายกำกับสิทธิ์ Store #2633 + SQL)</text>
<text x="422.0" y="1733" text-anchor="middle" class="step-sub">กรณี &lt;22.0s: ส่งผ่าน POST /v2/bot/message/reply (ฟรี $0.00!) | กรณี &gt;=22.0s: แจ้งเตือนชั่วคราว + Async Push API</text>
<line x1="693" y1="1744" x2="155" y2="1744" stroke="#3C4043" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-solid)"/>
</svg>