<text x="1270" y="1843" text-anchor="middle" class="box-sub" fill="#B06000">(Registry + CMEK 3LO Vault)</text>
<rect x="1438.5" y="1800" width="245" height="56" rx="10" fill="#F3E8FD" stroke="#9334E6" stroke-width="2"/>
